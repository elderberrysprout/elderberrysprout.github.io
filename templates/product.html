<article class="product">
  <div>
    <p class="crumbs"><a href="/shop/">Shop</a> › {{ title }}</p>
    {% if images %}
    <div class="gallery">
      {% for src in images %}
      <img src="{{ src }}" alt="{{ title }}">
      {% endfor %}
    </div>
    {% elif image %}
    <img src="{{ image }}" alt="{{ title }}">
    {% endif %}
  </div>
  <div>
    <h1>{{ title }}</h1>
    {% if sold_out %}<p class="sold">Sold Out</p>{% endif %}
    {% if price %}<p class="price" style="font-size:1.3rem">{{ price }}</p>{% endif %}
    {% if etsy_url %}
    <p><a class="btn" href="{{ etsy_url }}">View on Etsy</a></p>
    {% else %}
    <p><a class="btn" href="mailto:{{ site.email }}?subject={{ title | urlencode }}">Email to inquire</a></p>
    {% endif %}
    <div class="prose" style="width:auto;margin:0">{{ content | safe }}</div>
  </div>
</article>
