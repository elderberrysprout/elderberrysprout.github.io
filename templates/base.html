<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title and title != site.title %}{{ title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ description or site.description }}">
  <link rel="icon" href="{{ site.favicon }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="preload" href="/assets/fonts/cardinal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cardinal-alternate.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/main.css?v=kraft5">
  <meta property="og:title" content="{{ title or site.title }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="{% if og_type %}{{ og_type }}{% else %}website{% endif %}">
  {% if image %}<meta property="og:image" content="{{ site.url }}{{ image }}">{% endif %}
</head>
<body>
  <a class="skip" href="#main">Skip to Content</a>
  <header class="site-header">
    <div class="header-inner">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open Menu">
        <span></span><span></span><span></span>
      </button>
      <a class="logo" href="/">
        <img src="{{ site.logo }}" alt="{{ site.title }}">
      </a>
      <nav id="site-nav" class="site-nav">
        <a href="/shop/">Shop</a>
        <a href="/magic-blog/">Blog</a>
        <a href="/free-digital-downloads/">Freebies</a>
        <a href="/about/">About</a>
        <a href="/newsletter-signup/">Newsletter</a>
        <a href="/discontinued/">Previous Collections</a>
      </nav>
    </div>
  </header>
  <main id="main">
    {{ content | safe }}
  </main>
  <section class="subscribe">
    <div class="wrap">
      <h2>Subscribe</h2>
      <p>Sign up with your email address to receive news and updates.</p>
      <a class="btn" href="mailto:{{ site.email }}?subject=Newsletter%20signup">Email to sign up</a>
    </div>
  </section>
  <footer class="site-footer">
    <div class="footer-grid">
      <a class="footer-logo" href="/"><img src="{{ site.logo_footer }}" alt="{{ site.title }}"></a>
      <img class="footer-scene" src="/assets/images/stamp-green.gif" width="480" height="250" alt="Stamp drawings of candles, a book, and a steaming mug">
      <div class="footer-columns">
        <nav class="footer-nav" aria-label="Footer">
          <a href="/shop/">Shop</a>
          <a href="/magic-blog/">Magic</a>
          <a href="/about/">About</a>
          <a href="/contact/">Contact</a>
        </nav>
        <nav class="footer-nav" aria-label="More">
          <a href="/stockists/">Stockists</a>
          <a href="/shipping-and-returns/">Shipping &amp; Returns</a>
        </nav>
        <nav class="social" aria-label="Social">
          <a href="{{ site.youtube }}">YouTube</a>
          <a href="{{ site.instagram }}">Instagram</a>
          <a href="{{ site.etsy }}">Etsy</a>
          <a href="mailto:{{ site.email }}">Email</a>
        </nav>
      </div>
    </div>
  </footer>
  <script src="/assets/js/site.js?v=cardinal1"></script>
</body>
</html>
